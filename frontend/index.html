  <link href="assets/fonts.css" rel="stylesheet">
  <link href="assets/dark_theme.css?v=20261014_3" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "canvas-void": "#020202",
            "surface-charcoal": "#0A0A0F",
            "surface-elevated": "#12121A",
            "surface-container": "#1F1F25",
            "border-slate": "#1D1D24",
            "border-illuminated": "#33334A",
            "primary-container": "#5B5EE0",
            "iris-soft": "#7B78F2",
            "iris-deep": "#3F3CB8",
            "secondary": "#4EDEA3",
            "text-primary": "#FFFFFF",
            "text-secondary": "#9494A8",
            "text-muted": "#525266"
          },
          fontFamily: {
            sans: ["'Plus Jakarta Sans'", "'Inter'", "sans-serif"],
            mono: ["'JetBrains Mono'", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0A0A0F; }
    ::-webkit-scrollbar-thumb { background: #1D1D24; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #5B5EE0; }
  </style>
</head>
<body class="bg-canvas-void text-text-primary font-sans h-screen flex flex-col overflow-hidden antialiased">

  <!-- Top Bar -->
  <header class="h-14 bg-surface-charcoal/90 border-b border-border-slate px-4 flex items-center justify-between z-30 shrink-0 backdrop-blur-md">
    <!-- Brand -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-surface-elevated border border-border-slate flex items-center justify-center p-1.5 shadow-sm">
        <img src="assets/gigpulse_logo.svg" alt="GigPulse" class="w-full h-full object-contain">
      </div>
      <div class="flex items-baseline gap-2">

        <span class="text-[10px] px-2 py-0.5 rounded-full bg-primary-container/20 text-iris-soft border border-primary-container/30 uppercase tracking-widest font-mono">Screen Navigator</span>
      </div>
    </div>

    <!-- Viewport Switcher -->
    <div class="hidden md:flex items-center gap-1 bg-surface-elevated border border-border-slate p-1 rounded-lg">
      <button onclick="setViewport('100%', this)" class="viewport-btn active liquid-glass-indigo px-2.5 py-1 text-xs font-mono rounded text-white transition-all">Full View</button>
      <button onclick="setViewport('1440px', this)" class="viewport-btn px-2.5 py-1 text-xs font-mono rounded text-text-secondary hover:text-white transition-all">1440px</button>
      <button onclick="setViewport('1024px', this)" class="viewport-btn px-2.5 py-1 text-xs font-mono rounded text-text-secondary hover:text-white transition-all">1024px</button>
      <button onclick="setViewport('768px', this)" class="viewport-btn px-2.5 py-1 text-xs font-mono rounded text-text-secondary hover:text-white transition-all">768px (Tab)</button>
      <button onclick="setViewport('390px', this)" class="viewport-btn px-2.5 py-1 text-xs font-mono rounded text-text-secondary hover:text-white transition-all">390px (Mobile)</button>
    </div>

    <!-- Active Link & New Tab Button -->
    <div class="flex items-center gap-2">
      <span id="currentScreenBadge" class="hidden sm:inline-block font-mono text-xs text-text-secondary truncate max-w-[200px] border border-border-slate px-2 py-1 rounded bg-surface-elevated">01_landing_page_full.html</span>
      <a id="openNewTabBtn" href="01_landing_page_full.html" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-elevated hover:bg-surface-container border border-border-slate hover:border-iris-soft/50 text-xs font-medium text-white transition-all">
        <span>Open Standalone</span>
        <span class="material-symbols-outlined text-[14px]">open_in_new</span>
      </a>
    </div>
  </header>

  <!-- Main Split Layout -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar Screen List -->
    <aside class="w-72 bg-surface-charcoal/80 border-r border-border-slate flex flex-col shrink-0 overflow-y-auto">
      <div class="p-3 border-b border-border-slate">
        <div class="text-[11px] font-mono uppercase tracking-wider text-text-muted">Available Screens (10)</div>
      </div>
      
      <nav class="p-2 space-y-1" id="screenNav">
        <!-- Screen 00: Authentication Portal -->
        <button onclick="switchScreen('00_auth_login_signup.html', 'GigPulse Auth & Studio Entry Portal', this)" class="screen-btn w-full text-left p-2.5 rounded-xl border border-transparent hover:border-border-slate hover:bg-surface-elevated/60 flex items-start gap-3 transition-all group">
          <span class="text-xs font-mono font-bold text-amber-400 group-hover:text-white shrink-0 mt-0.5">00</span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-text-secondary group-hover:text-amber-300 transition-colors truncate">Auth & Studio Login</div>
            <div class="text-[10px] text-text-muted truncate">1-Click Demo Pass & Dual Auth</div>
          </div>
        </button>

        <!-- Screen 1: Full Landing -->
        <button onclick="switchScreen('01_landing_page_full.html', 'GigPulse Marketing Landing Page (Noema Cybernetic Theme)', this)" class="screen-btn w-full text-left p-2.5 rounded-xl border border-primary-container/40 bg-surface-elevated flex items-start gap-3 transition-all group">
          <span class="text-xs font-mono font-bold text-iris-soft group-hover:text-white shrink-0 mt-0.5">01</span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-white group-hover:text-iris-soft transition-colors truncate">Marketing Landing Page</div>
            <div class="text-[10px] text-text-muted truncate">Noema Orbital Cybernetic Theme</div>
          </div>
        </button>

        <!-- Screen 2: Landing Hero Preview -->
        <button onclick="switchScreen('01_landing_page_preview.html', 'GigPulse Landing Hero (Cockpit Preview)', this)" class="screen-btn w-full text-left p-2.5 rounded-xl border border-transparent hover:border-border-slate hover:bg-surface-elevated/60 flex items-start gap-3 transition-all group">
          <span class="text-xs font-mono font-bold text-text-muted group-hover:text-white shrink-0 mt-0.5">02</span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-text-secondary group-hover:text-white transition-colors truncate">Landing Hero Preview</div>
            <div class="text-[10px] text-text-muted truncate">Compact Hero Cockpit Dial</div>
          </div>
        </button>

        <!-- Screen 3: Executive Cockpit -->
        <button onclick="switchScreen('02_pulse_cockpit_dashboard.html', 'Pulse Cockpit Main Executive Dashboard', this)" class="screen-btn w-full text-left p-2.5 rounded-xl border border-transparent hover:border-border-slate hover:bg-surface-elevated/60 flex items-start gap-3 transition-all group">
          <span class="text-xs font-mono font-bold text-text-muted group-hover:text-white shrink-0 mt-0.5">03</span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-text-secondary group-hover:text-white transition-colors truncate">Pulse Cockpit Dashboard</div>
            <div class="text-[10px] text-text-muted truncate">Runway Radar & Agent Live Feed</div>
          </div>
        </button>

        <!-- Screen 4: Cash Flow & Runway Forecaster -->
        <button onclick="switchScreen('03_cash_flow_runway_forecaster.html', 'Cash Flow & Runway Forecaster', this)" class="screen-btn w-full text-left p-2.5 rounded-xl border border-transparent hover:border-border-slate hover:bg-surface-elevated/60 flex items-start gap-3 transition-all group">
          <span class="text-xs font-mono font-bold text-text-muted group-hover:text-white shrink-0 mt-0.5">04</span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-text-secondary group-hover:text-white transition-colors truncate">Cash Flow & Runway Forecaster</div>
            <div class="text-[10px] text-text-muted truncate">Monte Carlo Survival Curve</div>
          </div>
        </button>

        <!-- Screen 5: Invoice & Receivables Manager -->
        <button onclick="switchScreen('04_invoice_receivables_manager.html', 'Invoice & Receivables Operations Manager', this)" class="screen-btn w-full text-left p-2.5 rounded-xl border border-transparent hover:border-border-slate hover:bg-surface-elevated/60 flex items-start gap-3 transition-all group">
          <span class="text-xs font-mono font-bold text-text-muted group-hover:text-white shrink-0 mt-0.5">05</span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-text-secondary group-hover:text-white transition-colors truncate">Receivables Manager</div>
            <div class="text-[10px] text-text-muted truncate">Aging Buckets & Risk Tags</div>
          </div>
        </button>

        <!-- Screen 6: Dynamic Milestone Invoice Builder -->
        <button onclick="switchScreen('05_dynamic_milestone_invoice_builder.html', 'Dynamic Milestone-Based Smart Invoice Builder', this)" class="screen-btn w-full text-left p-2.5 rounded-xl border border-transparent hover:border-border-slate hover:bg-surface-elevated/60 flex items-start gap-3 transition-all group">
          <span class="text-xs font-mono font-bold text-text-muted group-hover:text-white shrink-0 mt-0.5">06</span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-text-secondary group-hover:text-white transition-colors truncate">Milestone Invoice Builder</div>
            <div class="text-[10px] text-text-muted truncate">Smart Contract Escrow Escapes</div>
          </div>
        </button>

        <!-- Screen 7: Autonomous Payment Chaser -->
        <button onclick="switchScreen('06_autonomous_smart_payment_chaser.html', 'Autonomous Multi-Stage Smart Payment Chaser', this)" class="screen-btn w-full text-left p-2.5 rounded-xl border border-transparent hover:border-border-slate hover:bg-surface-elevated/60 flex items-start gap-3 transition-all group">
          <span class="text-xs font-mono font-bold text-text-muted group-hover:text-white shrink-0 mt-0.5">07</span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-text-secondary group-hover:text-white transition-colors truncate">Smart Payment Chaser</div>
            <div class="text-[10px] text-text-muted truncate">Multi-Tone WhatsApp/Email Dispatch</div>
          </div>
        </button>

        <!-- Screen 8: Client Reliability Scorecard -->
        <button onclick="switchScreen('07_client_reliability_scorecard.html', 'Client Reliability & Underwriting Scorecard', this)" class="screen-btn w-full text-left p-2.5 rounded-xl border border-transparent hover:border-border-slate hover:bg-surface-elevated/60 flex items-start gap-3 transition-all group">
          <span class="text-xs font-mono font-bold text-text-muted group-hover:text-white shrink-0 mt-0.5">08</span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-text-secondary group-hover:text-white transition-colors truncate">Reliability Scorecard</div>
            <div class="text-[10px] text-text-muted truncate">Credit Grades (A to D) & Velocity</div>
          </div>
        </button>

        <!-- Screen 9: My Studio Account & Settings Hub -->
        <button onclick="switchScreen('08_studio_account_settings.html', 'My Studio Account & Freelance Integrations Hub', this)" class="screen-btn w-full text-left p-2.5 rounded-xl border border-transparent hover:border-border-slate hover:bg-surface-elevated/60 flex items-start gap-3 transition-all group">
          <span class="text-xs font-mono font-bold text-indigo-400 group-hover:text-white shrink-0 mt-0.5">09</span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-text-secondary group-hover:text-indigo-300 transition-colors truncate">My Studio Account</div>
            <div class="text-[10px] text-text-muted truncate">Upwork/Fiverr/Bank & Treasury Hub</div>
          </div>
        </button>
      </nav>

      <!-- Design Palette Badges -->
      <div class="mt-auto p-4 border-t border-border-slate bg-surface-elevated/40">
        <div class="text-[10px] font-mono text-text-muted uppercase tracking-wider mb-2">GrowthSphere Palette</div>
        <div class="grid grid-cols-5 gap-1.5">
          <div class="h-6 rounded bg-[#020202] border border-border-slate" title="Obsidian #020202"></div>
          <div class="h-6 rounded bg-[#0A0A0F] border border-border-slate" title="Charcoal #0A0A0F"></div>
          <div class="h-6 rounded bg-[#1D1D24] border border-border-slate" title="Slate #1D1D24"></div>
          <div class="h-6 rounded bg-[#5B5EE0]" title="Iris #5B5EE0"></div>
          <div class="h-6 rounded bg-[#10B981]" title="Mint #10B981"></div>
        </div>
      </div>
    </aside>

    <!-- Viewer Canvas Container -->
    <main class="flex-1 bg-[#050508] flex items-center justify-center p-2 sm:p-4 overflow-hidden relative">
      <div id="viewerWrapper" class="h-full w-full max-w-full rounded-xl overflow-hidden border border-border-slate bg-canvas-void shadow-2xl transition-all duration-300 relative">
        <iframe id="screenFrame" src="01_landing_page_full.html" class="w-full h-full border-0"></iframe>
      </div>
    </main>
  </div>

  <script>
    const frame = document.getElementById('screenFrame');
    const openBtn = document.getElementById('openNewTabBtn');
    const badge = document.getElementById('currentScreenBadge');
    const viewerWrapper = document.getElementById('viewerWrapper');

    function switchScreen(url, title, el) {
      // Bust iframe cache dynamically so updates are immediately visible
      const cacheBustUrl = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
      frame.src = cacheBustUrl;
      openBtn.href = url;
      badge.textContent = url;
      document.title = title + ' | GigPulse Navigator';

      // Update button active state
      document.querySelectorAll('.screen-btn').forEach(btn => {
        btn.classList.remove('border-primary-container/40', 'bg-surface-elevated', 'liquid-glass-indigo');
        btn.classList.add('border-transparent');
        const num = btn.querySelector('.font-mono');
        if (num) num.classList.remove('text-iris-soft');
        const txt = btn.querySelector('.text-xs');
        if (txt) {
          txt.classList.remove('text-white');
          txt.classList.add('text-text-secondary');
        }
      });

      if (el) {
        el.classList.add('border-primary-container/40', 'bg-surface-elevated', 'liquid-glass-indigo');
        el.classList.remove('border-transparent');
        const num = el.querySelector('.font-mono');
        if (num) num.classList.add('text-iris-soft');
        const txt = el.querySelector('.text-xs');
        if (txt) {
          txt.classList.add('text-white');
          txt.classList.remove('text-text-secondary');
        }
      }
    }

    function setViewport(width, el) {
      viewerWrapper.style.maxWidth = width;
      document.querySelectorAll('.viewport-btn').forEach(btn => {
        btn.classList.remove('bg-primary-container', 'text-white', 'active', 'liquid-glass-indigo');
        btn.classList.add('text-text-secondary');
      });
      el.classList.add('active', 'liquid-glass-indigo', 'text-white');
      el.classList.remove('text-text-secondary', 'bg-primary-container');
    }
  </script>
</body>
</html>
