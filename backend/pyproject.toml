[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gigpulse-financial-os"
version = "1.0.0"
description = "Autonomous Financial OS for Independent Founders & Studios"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
]

[tool.vercel]
entrypoint = "backend.server:app"
